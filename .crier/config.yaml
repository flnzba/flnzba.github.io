content_paths:
  - src/posts
site_base_url: https://fzeba.com
exclude_patterns:
  - 'src/posts/index.njk'
  - 'src/posts/tags.njk'
  - 'src/posts/posts.11tydata.js'
file_extensions:
  - .md
default_profile: blogs

profiles:
  blogs:
    - devto
    - hashnode
    # medium: API deprecated by Medium in Jan 2025 — no new integration tokens are issued.
    # If you have a pre-existing token, re-add `- medium` here and set MEDIUM_INTEGRATION_TOKEN.
