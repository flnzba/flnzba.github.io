<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="Real-time bidding auction flow from page load to DSP bids and broker harvesting">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .dt{font-size:13px;font-weight:600}
    .ds{font-size:11.5px}
  </style>
  <rect width="680" height="420" fill="#F6F7F4"/>

<defs><marker id="arw-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7A8288" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="240" y="20" width="200" height="54" rx="8" fill="#EFF1EC" stroke="#9AA097" stroke-width="0.75"/>
<text class="dt" x="340" y="42" text-anchor="middle" fill="#3A4038">Page or app loads</text>
<text class="ds" x="340" y="60" text-anchor="middle" fill="#6B7268">Ad slot detected</text>
<line x1="340" y1="74" x2="340" y2="102" stroke="#7A8288" stroke-width="1.25" marker-end="url(#arw-a)"/>
<rect x="200" y="108" width="280" height="54" rx="8" fill="#EDEBFA" stroke="#4C46A8" stroke-width="0.75"/>
<text class="dt" x="340" y="130" text-anchor="middle" fill="#2E2A6E">SSP builds bid request</text>
<text class="ds" x="340" y="148" text-anchor="middle" fill="#4C46A8">IDs, IP, geo, context, eids</text>
<line x1="340" y1="162" x2="340" y2="190" stroke="#7A8288" stroke-width="1.25" marker-end="url(#arw-a)"/>
<rect x="200" y="196" width="280" height="54" rx="8" fill="#EDEBFA" stroke="#4C46A8" stroke-width="0.75"/>
<text class="dt" x="340" y="218" text-anchor="middle" fill="#2E2A6E">Exchange broadcasts it</text>
<text class="ds" x="340" y="236" text-anchor="middle" fill="#4C46A8">To hundreds of bidders</text>
<path d="M340 250 L340 278 L200 278 L200 300" fill="none" stroke="#7A8288" stroke-width="1.25" marker-end="url(#arw-a)"/>
<path d="M340 250 L340 278 L480 278 L480 300" fill="none" stroke="#7A8288" stroke-width="1.25" marker-end="url(#arw-a)"/>
<rect x="80" y="306" width="240" height="54" rx="8" fill="#E1F1EB" stroke="#0E6E5C" stroke-width="0.75"/>
<text class="dt" x="200" y="328" text-anchor="middle" fill="#0A4A3D">DSPs bid, ad renders</text>
<text class="ds" x="200" y="346" text-anchor="middle" fill="#0E6E5C">Winner inside ~200 ms</text>
<rect x="360" y="306" width="240" height="54" rx="8" fill="#FBF0D6" stroke="#8A5A00" stroke-width="0.75"/>
<text class="dt" x="480" y="328" text-anchor="middle" fill="#5C3C00">Brokers harvest the stream</text>
<text class="ds" x="480" y="346" text-anchor="middle" fill="#8A5A00">Bid or no bid</text>
<rect x="110" y="392" width="12" height="12" rx="2" fill="#EDEBFA" stroke="#4C46A8" stroke-width="0.75"/>
<text class="ds" x="130" y="402" fill="#5C6570">Auction rails</text>
<rect x="260" y="392" width="12" height="12" rx="2" fill="#E1F1EB" stroke="#0E6E5C" stroke-width="0.75"/>
<text class="ds" x="280" y="402" fill="#5C6570">Ad buyers</text>
<rect x="400" y="392" width="12" height="12" rx="2" fill="#FBF0D6" stroke="#8A5A00" stroke-width="0.75"/>
<text class="ds" x="420" y="402" fill="#5C6570">Data harvesters</text>
</svg>
