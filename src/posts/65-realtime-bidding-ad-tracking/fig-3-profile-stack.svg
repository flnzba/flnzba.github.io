<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 0 680 478" role="img" aria-label="Five-layer profile construction stack: event log and identity spine feed behavioral features, inferred attributes, and segments and scores">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .dt{font-size:13px;font-weight:600}
    .ds{font-size:11.5px}
  </style>
  <rect width="680" height="478" fill="#F6F7F4"/>

<defs><marker id="arw-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7A8288" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="210" y="20" width="260" height="54" rx="8" fill="#EDEBFA" stroke="#4C46A8" stroke-width="0.75"/>
<text class="dt" x="340" y="42" text-anchor="middle" fill="#2E2A6E">Event log</text>
