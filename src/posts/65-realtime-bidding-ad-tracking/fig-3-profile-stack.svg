<line x1="340" y1="162" x2="340" y2="190" stroke="#7A8288" stroke-width="1.25" marker-end="url(#arw-d)"/>
<rect x="210" y="196" width="260" height="54" rx="8" fill="#FBF0D6" stroke="#8A5A00" stroke-width="0.75"/>
<text class="dt" x="340" y="218" text-anchor="middle" fill="#5C3C00">Behavioral features</text>
<text class="ds" x="340" y="236" text-anchor="middle" fill="#8A5A00">Home, work, sleep, habits</text>
<line x1="340" y1="250" x2="340" y2="278" stroke="#7A8288" stroke-width="1.25" marker-end="url(#arw-d)"/>
