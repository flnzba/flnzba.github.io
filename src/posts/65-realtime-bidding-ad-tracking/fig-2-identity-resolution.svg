<svg xmlns="http://www.w3.org/2000/svg" width="680" height="344" viewBox="0 0 680 344" role="img" aria-label="Identity resolution: five signal types converging through an identity graph into one persistent person-level profile">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .dt{font-size:13px;font-weight:600}
    .ds{font-size:11.5px}
  </style>
  <rect width="680" height="344" fill="#F6F7F4"/>

<defs><marker id="arw-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7A8288" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="180" height="40" rx="8" fill="#EFF1EC" stroke="#9AA097" stroke-width="0.75"/>
<text class="ds" x="130" y="64" text-anchor="middle" fill="#3A4038">3rd-party cookie</text>
<rect x="40" y="96" width="180" height="40" rx="8" fill="#EFF1EC" stroke="#9AA097" stroke-width="0.75"/>
<text class="ds" x="130" y="120" text-anchor="middle" fill="#3A4038">GAID / IDFA</text>
<rect x="40" y="152" width="180" height="40" rx="8" fill="#EFF1EC" stroke="#9AA097" stroke-width="0.75"/>
<text class="ds" x="130" y="176" text-anchor="middle" fill="#3A4038">Hashed email (eids)</text>
<rect x="40" y="208" width="180" height="40" rx="8" fill="#EFF1EC" stroke="#9AA097" stroke-width="0.75"/>
<text class="ds" x="130" y="232" text-anchor="middle" fill="#3A4038">IP + fingerprint</text>
<rect x="40" y="264" width="180" height="40" rx="8" fill="#EFF1EC" stroke="#9AA097" stroke-width="0.75"/>
<text class="ds" x="130" y="288" text-anchor="middle" fill="#3A4038">CAPI server event</text>
<line x1="220" y1="60" x2="278" y2="164" stroke="#7A8288" stroke-width="1"/>
<line x1="220" y1="116" x2="278" y2="168" stroke="#7A8288" stroke-width="1"/>
<line x1="220" y1="172" x2="278" y2="172" stroke="#7A8288" stroke-width="1"/>
<line x1="220" y1="228" x2="278" y2="176" stroke="#7A8288" stroke-width="1"/>
<line x1="220" y1="284" x2="278" y2="180" stroke="#7A8288" stroke-width="1"/>
<rect x="280" y="142" width="180" height="60" rx="8" fill="#EDEBFA" stroke="#4C46A8" stroke-width="0.75"/>
<text class="dt" x="370" y="166" text-anchor="middle" fill="#2E2A6E">Identity graph</text>
<text class="ds" x="370" y="186" text-anchor="middle" fill="#4C46A8">RampID · UID2 · ID5</text>
<line x1="460" y1="172" x2="490" y2="172" stroke="#7A8288" stroke-width="1.25" marker-end="url(#arw-b)"/>
<rect x="498" y="142" width="140" height="60" rx="8" fill="#FBF0D6" stroke="#8A5A00" stroke-width="0.75"/>
<text class="dt" x="568" y="166" text-anchor="middle" fill="#5C3C00">One person</text>
<text class="ds" x="568" y="186" text-anchor="middle" fill="#8A5A00">Cross-device</text>
</svg>
