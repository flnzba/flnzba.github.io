# harness:begin
[features]
memories = true

[mcp_servers.codegraph]
startup_timeout_sec = 15
command = ".harness/node_modules/.bin/codegraph"
args = ["serve", "--mcp", "--path", "."]

[mcp_servers.workos]
url = "https://mcp.workos.com/mcp"

[mcp_servers.playwright]
command = ".harness/node_modules/.bin/playwright-mcp"
args = ["--browser", "chromium", "--headless", "--isolated"]

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "context-used", "run-state"]
# harness:end
